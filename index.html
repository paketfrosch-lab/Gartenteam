<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174f32">
<title>Gartenteam – Tierpark Germendorf Online</title>>
<style>
:root{--g:#174f32;--g2:#2f744c;--bg:#f3f5ed;--card:#fff;--muted:#687268;--line:#dde4d9;--accent:#e9f3e8}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#183023}
header{background:linear-gradient(135deg,#123e29,#2d744a);color:white;padding:22px 18px 28px;border-radius:0 0 26px 26px}
header h1{margin:0;font-size:26px} header p{margin:5px 0 0;opacity:.85}
main{max-width:720px;margin:auto;padding:16px 14px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,button.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 12px #173b2520}
button{font:inherit}.tile{text-align:left;cursor:pointer;color:#183023}.tile b{display:block;font-size:17px;margin-top:7px}.tile span{font-size:12px;color:var(--muted)}
.icon{font-size:27px}.section{display:none}.section.active{display:block}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.back{border:0;background:#e2ebdf;border-radius:12px;padding:9px 12px}.primary{border:0;background:var(--g);color:white;border-radius:13px;padding:11px 14px}
.task{background:white;border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;display:flex;gap:11px;align-items:flex-start}
.task.done{opacity:.6}.task.done .tasktitle{text-decoration:line-through}.task input{width:22px;height:22px;accent-color:var(--g)}
.tasktitle{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{display:inline-block;background:var(--accent);color:var(--g);padding:4px 8px;border-radius:999px;font-size:11px;margin-top:7px}
label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}input[type=text],select,textarea{width:100%;padding:11px;border:1px solid #cfd8cc;border-radius:12px;background:white;font:inherit}
textarea{min-height:75px}.people,.areas{display:grid;gap:9px}.person,.area{background:white;border:1px solid var(--line);border-radius:14px;padding:13px}
.person b,.area b{display:block}.small{font-size:12px;color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
nav div{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;padding:7px 2px;color:#53645a;font-size:11px}nav button i{display:block;font-style:normal;font-size:21px}
.notice{background:#fff8dc;border:1px solid #eadba3;border-radius:13px;padding:11px;font-size:12px;color:#665923;margin-bottom:12px}
.count{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header><h1>🌿 Gartenteam</h1><p>Tierpark Germendorf · Teamleiter-Ansicht</p></header>
<main>
<section id="home" class="section active">
<div class="notice">V3 Online · iPhone & Android · gemeinsame Aufgaben</div>
<div class="grid">
<button class="tile" onclick="show('today')"><span class="icon">✅</span><b>Heute</b><span>Aufgaben ansehen & abhaken</span></button>
<button class="tile" onclick="show('newtask')"><span class="icon">➕</span><b>Neue Aufgabe</b><span>Aufgabe verteilen</span></button>
<button class="tile" onclick="show('team')"><span class="icon">👥</span><b>Team</b><span>Mitarbeiterübersicht</span></button>
<button class="tile" onclick="show('areas')"><span class="icon">🌳</span><b>Bereiche</b><span>Gartenbereiche</span></button>
<button class="tile" onclick="show('issue')"><span class="icon">📸</span><b>Mangel melden</b><span>Problem dokumentieren</span></button>
<button class="tile" onclick="show('material')"><span class="icon">🧤</span><b>Material</b><span>Bedarf notieren</span></button>
</div>
</section>

<section id="today" class="section"><div class="topline"><button class="back" onclick="show('home')">← Zurück</button><b>Heute</b><span id="counter" class="count"></span></div><div id="tasks"></div></section>

<section id="newtask" class="section"><div class="topline"><button class="back" onclick="show('home')">← Zurück</button><b>Neue Aufgabe</b></div>
<div class="card">
<label>Aufgabe</label><input id="title" type="text" placeholder="z. B. Hecke am Strand entfernen">
<label>Bereich</label><select id="area"></select>
<label>Mitarbeiter</label><select id="person"></select>
<label>Art</label><select id="repeat"><option>Einmalig</option><option>Wiederkehrend</option></select>
<label>Hinweis</label><textarea id="note" placeholder="Optional"></textarea>
<br><button class="primary" onclick="addTask()">Aufgabe speichern</button>
</div></section>

<section id="team" class="section"><div class="topline"><button class="back" onclick="show('home')">← Zurück</button><b>Team</b></div><div id="people" class="people"></div></section>
<section id="areas" class="section"><div class="topline"><button class="back" onclick="show('home')">← Zurück</button><b>Bereiche</b></div><div id="areaList" class="areas"></div></section>

<section id="issue" class="section"><div class="topline"><button class="back" onclick="show('home')">← Zurück</button><b>Mangel melden</b></div><div class="card">
<label>Bereich</label><select id="issueArea"></select><label>Beschreibung</label><textarea id="issueText" placeholder="Was ist aufgefallen?"></textarea>
<p class="small">Foto-Upload kommt in einer späteren Online-Version dazu.</p><button class="primary" onclick="saveNote('Mangel','issueArea','issueText')">Mangel speichern</button></div></section>

<section id="material" class="section"><div class="topline"><button class="back" onclick="show('home')">← Zurück</button><b>Materialbedarf</b></div><div class="card">
<label>Bereich</label><select id="matArea"></select><label>Benötigtes Material</label><textarea id="matText" placeholder="z. B. 2 Säcke Pflanzerde"></textarea>
<button class="primary" onclick="saveNote('Material','matArea','matText')">Bedarf speichern</button></div></section>
</main>

<nav><div>
<button onclick="show('home')"><i>🏠</i>Start</button>
<button onclick="show('today')"><i>✅</i>Heute</button>
<button onclick="show('newtask')"><i>➕</i>Aufgabe</button>
<button onclick="show('team')"><i>👥</i>Team</button>
</div></nav>

<script>
const people=["Kevin (Teamleiter)","Marie","Eileen","Klaus","Werner","Ferienarbeiter 1","Ferienarbeiter 2"];
const areas=["Parkplatz","Kassenbereich","Spielplatz","Koiteich","Außenring vorne","Außenring hinten","Büro / Teich","Hundeplatz / Strand"];
const defaults=[
{id:1,title:"Toiletten kontrollieren",area:"Kassenbereich",person:"Kevin (Teamleiter)",repeat:"Wiederkehrend",note:"Kontrolle & Sauberkeit",done:false},
{id:2,title:"Außenring kontrollieren",area:"Außenring vorne",person:"Marie",repeat:"Einmalig",note:"Pflegearbeiten prüfen",done:false},
{id:3,title:"Hecken und Bäume entfernen",area:"Hundeplatz / Strand",person:"Ferienarbeiter 1",repeat:"Wiederkehrend",note:"Nur erlaubte Handarbeiten",done:false},
{id:4,title:"Hecken und Bäume entfernen",area:"Hundeplatz / Strand",person:"Ferienarbeiter 2",repeat:"Wiederkehrend",note:"Nur erlaubte Handarbeiten",done:false}
];
const SUPABASE_URL="https://https://toddhsdirldwvygpjkea.supabase.co/rest/v1/.supabase.co";
const SUPABASE_KEY="sb_publishable_A7D38leY7Gw_kxXp4tK61g_Gdt15MDK";
let tasks=[];

async function db(path, options={}){
  const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{
    ...options,
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":"application/json",
      ...(options.headers||{})
    }
  });
  const text=await r.text();
  if(!r.ok) throw new Error(text||("HTTP "+r.status));
  return text ? JSON.parse(text) : null;
}

async function loadTasks(){
  try{
    tasks=await db("Aufgaben?select=*&order=created_at.desc")||[];
  }catch(e){
    console.error(e);
    alert("Aufgaben konnten nicht geladen werden. "+e.message);
  }
  renderTasks();
}

function show(id){
  document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="today") loadTasks();
  scrollTo(0,0);
}

function fillSelect(id,arr){document.getElementById(id).innerHTML=arr.map(x=>`<option>${x}</option>`).join("")}
["area","issueArea","matArea"].forEach(id=>fillSelect(id,areas));fillSelect("person",people);
document.getElementById("people").innerHTML=people.map((p,i)=>`<div class="person"><b>${i===0?"🌿":"👤"} ${p}</b><span class="small">${i===0?"Kann alle Aufgaben verwalten":"Mitarbeiter"}</span></div>`).join("");
document.getElementById("areaList").innerHTML=areas.map(a=>`<div class="area"><b>📍 ${a}</b><span class="small">Aufgaben können diesem Bereich zugeordnet werden.</span></div>`).join("");

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function isDone(t){return t.status==="erledigt" || !!t.completed_at}

function renderTasks(){
 const el=document.getElementById("tasks");
 el.innerHTML=tasks.length?tasks.map(t=>`<div class="task ${isDone(t)?"done":""}"><input type="checkbox" ${isDone(t)?"checked":""} onchange="toggle(${t.id},this.checked)"><div><div class="tasktitle">${esc(t.title)}</div><div class="meta">📍 ${esc(t.area||"")} · 👤 ${esc(t.assigned_to||"")}</div>${t.description?`<div class="meta">${esc(t.description)}</div>`:""}${t.notes?`<div class="meta">${esc(t.notes)}</div>`:""}<span class="badge">${esc(t.priority||"normal")}</span></div></div>`).join(""):`<div class="card">Noch keine Aufgaben vorhanden.</div>`;
 document.getElementById("counter").textContent=`${tasks.filter(isDone).length}/${tasks.length} erledigt`;
}

async function toggle(id,done){
  try{
    const patch={
      status:done?"erledigt":"offen",
      completed_at:done?new Date().toISOString():null
    };
    await db("Task?id=eq."+encodeURIComponent(id),{
      method:"PATCH",
      headers:{"Prefer":"return=minimal"},
      body:JSON.stringify(patch)
    });
    await loadTasks();
  }catch(e){
    alert("Änderung konnte nicht gespeichert werden. "+e.message);
    await loadTasks();
  }
}

async function addTask(){
 let title=document.getElementById("title").value.trim();
 if(!title){alert("Bitte eine Aufgabe eingeben.");return}
 try{
   const row={
     title,
     description:document.getElementById("note").value.trim()||null,
     area:document.getElementById("area").value||null,
     assigned_to:document.getElementById("person").value||null,
     status:"offen",
     priority:"normal",
     notes:document.getElementById("repeat").value||null
   };
   await db("Aufgabe",{
     method:"POST",
     headers:{"Prefer":"return=minimal"},
     body:JSON.stringify(row)
   });
   document.getElementById("title").value="";
   document.getElementById("note").value="";
   show("today");
 }catch(e){alert("Aufgabe konnte nicht gespeichert werden. "+e.message)}
}
function saveNote(kind,areaId,textId){
 let text=document.getElementById(textId).value.trim();if(!text){alert("Bitte eine Beschreibung eingeben.");return}
 let notes=JSON.parse(localStorage.getItem("gt_notes")||"[]");notes.unshift({kind,area:document.getElementById(areaId).value,text,date:new Date().toLocaleString("de-DE")});localStorage.setItem("gt_notes",JSON.stringify(notes));document.getElementById(textId).value="";alert(kind+" wurde gespeichert.");
}
loadTasks();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script>
</body></html>
